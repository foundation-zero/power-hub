name: PowerHub HMI
on:
  push:

jobs:
  graphs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - run: pipx install poetry==1.7.1

      - run: poetry install

      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2

      - name: Run simulation notebook
        run: poetry run jupyter nbconvert --execute --to html control_graph.ipynb
        working-directory: analysis

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: control_graphs
          path: "analysis/control_graphs/*.svg"

  app-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/package.json # use the packageManager pnpm version

      - uses: actions/setup-node@v4
        with:
          node-version-file: "./apps/.nvmrc"
          cache: "pnpm"
          cache-dependency-path: apps/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: apps

      - run: pnpm lint --max-warnings 0
        working-directory: apps

      - run: pnpm type-check
        working-directory: apps

      - run: pnpm test:unit
        working-directory: apps

  deploy:
    needs: [graphs, app-test]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Extract alias
        shell: bash
        run: |
          export BRANCH=${GITHUB_REF#refs/heads/}
          echo "alias=$(ruby -e "puts ENV['BRANCH'].tr('/_', '-').chomp('-')[0..27]")" >> "$GITHUB_OUTPUT"
        id: extract-alias

      - uses: chrnorm/deployment-action@v2
        name: Create Dashboard GitHub deployment
        id: dashboard_deployment
        with:
          token: "${{ github.token }}"
          initial-status: success
          environment-url: http://${{steps.extract-alias.outputs.alias}}.power-hub-dashboard.pages.dev
          environment: ${{steps.deploy.outputs.environment}}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node env
        uses: actions/setup-node@v3
        with:
          node-version-file: "./apps/.nvmrc"

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          package_json_file: apps/package.json # use the packageManager pnpm version
          run_install: false

      - name: Install dependencies
        working-directory: ./apps
        run: pnpm install --frozen-lockfile

      - name: Download latest control graphs
        uses: actions/download-artifact@v4
        with:
          name: control_graphs
          path: "./apps/dashboard/public/control-graphs"
          repository: ${{ github.repository }}

      - name: Generate Dashboard
        working-directory: ./apps
        run: pnpm build:dashboard
        env:
          VITE_API_BEARER_TOKEN: ${{secrets.POWER_HUB_API_TOKEN}}

      - name: Deploy Dashboard (Public)
        id: deploy_dashboard
        # the branch name is passed via env, never interpolated into the script
        run: npx --yes wrangler@3 pages deploy ./apps/dashboard/dist --project-name=power-hub-dashboard --branch="$BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
